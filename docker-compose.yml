name: openclassrooms

services:
  postgres_db:
    image: postgres:15
    container_name: 4_deploy_ml_model
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_password_123
      POSTGRES_DB: futurisys_db
    ports:
      - "5432:5432"
    volumes:
      - openclassrooms_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_OCR
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ocr.fr
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db     

volumes:
  openclassrooms_postgres_data: