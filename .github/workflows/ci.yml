name: CI - Tests Automatiques

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐍 Installation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🛠️ Installation de l'outil uv
        run: pip install uv

      - name: 📦 Installation des dépendances du projet
        run: uv sync

      - name: 🧪 Exécution des tests Pytest
        run: uv run python -m pytest -W ignore